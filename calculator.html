<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金收益计算器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            padding: 16px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header h1 {
            font-size: 22px;
            color: #1a2332;
            margin: 0 0 4px 0;
        }
        .header p {
            color: #8895aa;
            margin: 0;
            font-size: 14px;
        }
        .fund-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f2f5;
        }
        .fund-row:last-child { border-bottom: none; }
        .fund-row .field-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 70px;
        }
        .fund-row .field-group label {
            font-size: 11px;
            color: #8895aa;
            margin-bottom: 2px;
        }
        .fund-row input {
            padding: 6px 8px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 14px;
            background: #fafbfc;
            width: 100%;
        }
        .fund-row input:focus {
            outline: none;
            border-color: #4f8cf7;
            background: white;
        }
        .fund-row .code-input { min-width: 80px; flex: 0.7; }
        .fund-row .shares-input { min-width: 90px; flex: 0.8; }
        .fund-row .cost-input { min-width: 90px; flex: 0.8; }
        .fund-row .remove-btn {
            background: none;
            border: none;
            color: #d73a49;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 6px;
            margin-top: 14px;
        }
        .fund-row .remove-btn:hover { opacity: 0.6; }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #4f8cf7;
            color: white;
        }
        .btn-primary:hover { background: #3a7ae8; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-outline {
            background: transparent;
            color: #4f8cf7;
            border: 1.5px solid #4f8cf7;
        }
        .btn-outline:hover { background: #f0f5ff; }
        .result-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f2f5;
        }
        .result-item:last-child { border-bottom: none; }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 16px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .result-detail {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 4px 16px;
            margin-top: 6px;
            font-size: 14px;
            color: #3d4a5c;
        }
        .result-detail span { display: flex; align-items: center; gap: 4px; }
        .positive { color: #e53935; }
        .negative { color: #43a047; }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            text-align: center;
        }
        .summary-grid .stat {
            background: #f8f9fc;
            padding: 10px 6px;
            border-radius: 8px;
        }
        .summary-grid .stat .num {
            font-size: 20px;
            font-weight: 700;
        }
        .summary-grid .stat .label {
            font-size: 12px;
            color: #8895aa;
            margin-top: 2px;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #d0d7de;
            border-top-color: #4f8cf7;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-tip { color: #8895aa; text-align: center; padding: 20px 0; }
        .footer { margin-top: 20px; text-align: center; color: #b0bccd; font-size: 13px; }
        .error-msg { color: #d73a49; font-size: 13px; margin-top: 8px; }
        .fund-name-tag {
            font-size: 13px;
            font-weight: 500;
            color: #1a2332;
            padding: 2px 10px;
            background: #eef2f7;
            border-radius: 12px;
            display: inline-block;
        }
        @media (max-width: 600px) {
            .fund-row { gap: 6px; }
            .fund-row .field-group { min-width: 60px; }
            .fund-row input { font-size: 13px; padding: 5px 6px; }
            .fund-row .code-input { min-width: 65px; flex: 0.5; }
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .result-detail { grid-template-columns: 1fr 1fr; }
            .btn { padding: 8px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card header">
        <h1>📊 基金收益计算器</h1>
        <p>输入基金代码、持有份额和持仓成本，点击计算查看当日收益和累计收益</p>
    </div>

    <!-- 输入区 -->
    <div class="card">
        <div id="fundList"></div>
        <div class="btn-group">
            <button class="btn btn-outline" id="addBtn">＋ 添加基金</button>
            <button class="btn btn-primary" id="calcBtn">📈 计算收益</button>
        </div>
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <!-- 结果区 -->
    <div class="card" id="resultArea" style="display:none;">
        <div id="resultSummary"></div>
        <div id="resultDetail"></div>
    </div>

    <div class="footer">数据来源：天天基金网 · 仅供估算参考</div>
</div>

<script>
// ============================================================
// 默认预填三只基金
// ============================================================
const DEFAULT_FUNDS = [
    { code: "021778", shares: 359.16, cost: 3000 },
    { code: "160213", shares: 190.75, cost: 2000 },
    { code: "018738", shares: 269.19, cost: 1500 },
];

let funds = [];

// ============================================================
// 获取净值（使用支持跨域的接口）
// ============================================================
async function fetchNav(fundCode) {
    // 使用天天基金网的JSONP接口，通过动态script加载绕过跨域
    return new Promise((resolve) => {
        const callbackName = 'jsonp_callback_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        const script = document.createElement('script');
        const url = `https://fund.eastmoney.com/f10/F10DataApi.aspx?type=lsjz&code=${fundCode}&page=1&per=10&callback=${callbackName}&_=${Date.now()}`;
        
        // 超时处理
        const timeout = setTimeout(() => {
            document.head.removeChild(script);
            delete window[callbackName];
            resolve(null);
        }, 15000);

        // 定义回调函数
        window[callbackName] = function(data) {
            clearTimeout(timeout);
            document.head.removeChild(script);
            delete window[callbackName];
            
            try {
                // 解析返回的HTML表格
                const html = data;
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const rows = doc.querySelectorAll('tbody tr');
                if (!rows || rows.length < 2) {
                    resolve(null);
                    return;
                }
                const navList = [];
                for (let i = 0; i < Math.min(rows.length, 5); i++) {
                    const cells = rows[i].querySelectorAll('td');
                    if (cells.length < 2) continue;
                    const date = cells[0].textContent.trim();
                    const nav = parseFloat(cells[1].textContent.trim());
                    if (date && !isNaN(nav) && nav > 0) {
                        navList.push({ date, nav });
                    }
                }
                if (navList.length < 2) {
                    resolve(null);
                    return;
                }
                resolve(navList);
            } catch (e) {
                console.warn('解析失败:', e);
                resolve(null);
            }
        };

        script.src = url;
        script.onerror = function() {
            clearTimeout(timeout);
            document.head.removeChild(script);
            delete window[callbackName];
            resolve(null);
        };
        document.head.appendChild(script);
    });
}

// ============================================================
// 获取基金名称
// ============================================================
async function fetchFundName(code) {
    try {
        const resp = await fetch(`https://fund.eastmoney.com/pingzhongdata/${code}.js`);
        const text = await resp.text();
        const match = text.match(/var fName_code\s*=\s*"([^"]+)"/);
        if (match) return match[1];
        return code;
    } catch (e) {
        return code;
    }
}

// ============================================================
// 渲染输入
// ============================================================
function renderInputs() {
    const container = document.getElementById('fundList');
    if (funds.length === 0) {
        container.innerHTML = `<div class="empty-tip">还没有基金，点击下方「添加基金」开始</div>`;
        return;
    }
    let html = '';
    funds.forEach((f, idx) => {
        html += `
            <div class="fund-row" data-index="${idx}">
                <div class="field-group code-input">
                    <label>📌 基金代码</label>
                    <input type="text" value="${f.code}" placeholder="如 021778" data-field="code">
                </div>
                <div class="field-group shares-input">
                    <label>📦 持有份额</label>
                    <input type="number" step="0.01" value="${f.shares}" placeholder="如 359.16" data-field="shares">
                </div>
                <div class="field-group cost-input">
                    <label>💳 持仓成本（元）</label>
                    <input type="number" step="0.01" value="${f.cost}" placeholder="如 3000" data-field="cost">
                </div>
                <button class="remove-btn" data-index="${idx}" title="删除">✕</button>
            </div>
        `;
    });
    container.innerHTML = html;

    container.querySelectorAll('.fund-row').forEach(row => {
        const idx = parseInt(row.dataset.index);
        row.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('input', () => {
                const field = inp.dataset.field;
                if (field === 'code') {
                    funds[idx].code = inp.value.trim().toUpperCase();
                } else {
                    const val = parseFloat(inp.value);
                    funds[idx][field] = isNaN(val) ? 0 : val;
                }
            });
        });
        const delBtn = row.querySelector('.remove-btn');
        delBtn.addEventListener('click', () => {
            funds.splice(idx, 1);
            renderInputs();
            document.getElementById('resultArea').style.display = 'none';
        });
    });
}

// ============================================================
// 显示结果
// ============================================================
function showResults(results, summary) {
    const area = document.getElementById('resultArea');
    area.style.display = 'block';

    const summaryHtml = `
        <div class="summary-grid">
            <div class="stat">
                <div class="num ${summary.totalProfit >= 0 ? 'positive' : 'negative'}">${summary.totalProfit >= 0 ? '+' : ''}${summary.totalProfit.toFixed(2)}</div>
                <div class="label">今日总收益 (元)</div>
            </div>
            <div class="stat">
                <div class="num ${summary.totalAccumProfit >= 0 ? 'positive' : 'negative'}">${summary.totalAccumProfit >= 0 ? '+' : ''}${summary.totalAccumProfit.toFixed(2)}</div>
                <div class="label">累计总收益 (元)</div>
            </div>
            <div class="stat">
                <div class="num ${summary.totalAccumRate >= 0 ? 'positive' : 'negative'}">${summary.totalAccumRate >= 0 ? '+' : ''}${summary.totalAccumRate.toFixed(2)}%</div>
                <div class="label">累计总收益率</div>
            </div>
            <div class="stat">
                <div class="num">${summary.totalMarketValue.toFixed(2)}</div>
                <div class="label">账户总市值 (元)</div>
            </div>
        </div>
    `;
    document.getElementById('resultSummary').innerHTML = summaryHtml;

    let detailHtml = '';
    results.forEach(r => {
        const profitCls = r.profit >= 0 ? 'positive' : 'negative';
        const accumCls = r.accumProfit >= 0 ? 'positive' : 'negative';
        detailHtml += `
            <div class="result-item">
                <div class="result-header">
                    <span>【${r.name || r.code}】(${r.code})</span>
                    <span class="${profitCls}">今日 ${r.profit >= 0 ? '+' : ''}${r.profit.toFixed(2)} 元</span>
                </div>
                <div class="result-detail">
                    <span>📅 净值: ${r.nav.toFixed(4)} (${r.date})</span>
                    <span>📊 前日: ${r.prevNav.toFixed(4)}</span>
                    <span>💰 市值: ${r.marketValue.toFixed(2)} 元</span>
                    <span>📈 累计: <span class="${accumCls}">${r.accumProfit >= 0 ? '+' : ''}${r.accumProfit.toFixed(2)} 元</span></span>
                    <span>📈 收益率: <span class="${accumCls}">${r.accumRate >= 0 ? '+' : ''}${r.accumRate.toFixed(2)}%</span></span>
                    <span>💳 本金: ${r.cost.toFixed(2)} 元</span>
                </div>
            </div>
        `;
    });
    document.getElementById('resultDetail').innerHTML = detailHtml;
}

// ============================================================
// 计算主逻辑
// ============================================================
async function calculate() {
    const btn = document.getElementById('calcBtn');
    const errorDiv = document.getElementById('errorMsg');
    errorDiv.textContent = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="loading"></span> 计算中...';

    const validFunds = funds.filter(f => f.code && f.code.trim().length >= 6 && f.shares > 0 && f.cost > 0);
    if (validFunds.length === 0) {
        errorDiv.textContent = '⚠️ 请至少添加一只有效的基金（代码6位、份额>0、成本>0）';
        btn.disabled = false;
        btn.innerHTML = '📈 计算收益';
        return;
    }

    const results = [];
    let totalProfit = 0, totalAccumProfit = 0, totalMarketValue = 0, totalCost = 0;

    for (const f of validFunds) {
        // 先获取基金名称
        let name = f.code;
        try {
            const fetchedName = await fetchFundName(f.code);
            if (fetchedName) name = fetchedName;
        } catch (e) {}

        const navData = await fetchNav(f.code);
        if (!navData || navData.length < 2) {
            results.push({
                code: f.code,
                name: name,
                shares: f.shares,
                cost: f.cost,
                nav: 0,
                prevNav: 0,
                date: '-',
                profit: 0,
                marketValue: 0,
                accumProfit: 0,
                accumRate: 0,
                error: true
            });
            continue;
        }

        const latest = navData[0];
        const prev = navData[1];
        const nav = latest.nav;
        const prevNav = prev.nav;
        const date = latest.date;
        const marketValue = nav * f.shares;
        const profit = (nav - prevNav) * f.shares;
        const accumProfit = marketValue - f.cost;
        const accumRate = f.cost > 0 ? (accumProfit / f.cost) * 100 : 0;

        results.push({
            code: f.code,
            name: name,
            shares: f.shares,
            cost: f.cost,
            nav,
            prevNav,
            date,
            profit,
            marketValue,
            accumProfit,
            accumRate,
            error: false
        });

        totalProfit += profit;
        totalAccumProfit += accumProfit;
        totalMarketValue += marketValue;
        totalCost += f.cost;
    }

    const totalAccumRate = totalCost > 0 ? (totalAccumProfit / totalCost) * 100 : 0;
    const summary = {
        totalProfit,
        totalAccumProfit,
        totalAccumRate,
        totalMarketValue,
        totalCost
    };

    showResults(results, summary);
    btn.disabled = false;
    btn.innerHTML = '📈 计算收益';
}

// ============================================================
// 初始化
// ============================================================
function init() {
    funds = DEFAULT_FUNDS.map(f => ({ ...f }));
    renderInputs();

    document.getElementById('addBtn').addEventListener('click', () => {
        funds.push({ code: '', shares: 0, cost: 0 });
        renderInputs();
        document.getElementById('resultArea').style.display = 'none';
        document.getElementById('errorMsg').textContent = '';
    });

    document.getElementById('calcBtn').addEventListener('click', calculate);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.closest('#fundList')) {
            calculate();
        }
    });
}

init();
</script>
</body>
</html>
