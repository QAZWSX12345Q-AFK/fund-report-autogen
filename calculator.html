<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金收益计算器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            padding: 16px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header h1 {
            font-size: 22px;
            color: #1a2332;
            margin: 0 0 4px 0;
        }
        .header p {
            color: #8895aa;
            margin: 0;
            font-size: 14px;
        }
        .header .tip {
            background: #e3f2fd;
            border-left: 3px solid #1976d2;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #0d47a1;
            margin-top: 10px;
        }
        .header .tip strong { color: #0d47a1; }
        .fund-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: flex-end;
            padding: 10px 0;
            border-bottom: 1px solid #f0f2f5;
        }
        .fund-row:last-child { border-bottom: none; }
        .fund-row .field-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 60px;
        }
        .fund-row .field-group label {
            font-size: 11px;
            color: #8895aa;
            margin-bottom: 2px;
            font-weight: 500;
        }
        .fund-row .field-group label .required { color: #d73a49; }
        .fund-row input {
            padding: 6px 8px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 14px;
            background: #fafbfc;
            width: 100%;
        }
        .fund-row input:focus {
            outline: none;
            border-color: #4f8cf7;
            background: white;
            box-shadow: 0 0 0 3px rgba(79,140,247,0.1);
        }
        .fund-row input::placeholder {
            color: #b0bccd;
            font-size: 12px;
        }
        .fund-row input:disabled {
            background: #f0f2f5;
            color: #666;
        }
        .fund-row .code-input { min-width: 75px; flex: 0.5; }
        .fund-row .shares-input { min-width: 80px; flex: 0.7; }
        .fund-row .cost-input { min-width: 80px; flex: 0.7; }
        .fund-row .nav-input { min-width: 75px; flex: 0.5; }
        .fund-row .prev-input { min-width: 75px; flex: 0.5; }
        .fund-row .remove-btn {
            background: none;
            border: none;
            color: #d73a49;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 6px;
            margin-bottom: 2px;
        }
        .fund-row .remove-btn:hover { opacity: 0.6; }
        .fund-row .fetch-status {
            font-size: 12px;
            margin-left: 4px;
            color: #8895aa;
        }
        .fund-row .fetch-status.loading { color: #4f8cf7; }
        .fund-row .fetch-status.success { color: #28a745; }
        .fund-row .fetch-status.error { color: #d73a49; }
        .fund-row .fund-name-tag {
            font-size: 11px;
            color: #4f8cf7;
            margin-top: 2px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #4f8cf7;
            color: white;
        }
        .btn-primary:hover { background: #3a7ae8; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-outline {
            background: transparent;
            color: #4f8cf7;
            border: 1.5px solid #4f8cf7;
        }
        .btn-outline:hover { background: #f0f5ff; }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover { background: #218838; }
        .btn-warning {
            background: #ffc107;
            color: #1a2332;
        }
        .btn-warning:hover { background: #e0a800; }
        .result-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f2f5;
        }
        .result-item:last-child { border-bottom: none; }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 16px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .result-detail {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 4px 16px;
            margin-top: 6px;
            font-size: 14px;
            color: #3d4a5c;
        }
        .result-detail span { display: flex; align-items: center; gap: 4px; }
        .positive { color: #e53935; }
        .negative { color: #43a047; }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            text-align: center;
        }
        .summary-grid .stat {
            background: #f8f9fc;
            padding: 10px 6px;
            border-radius: 8px;
        }
        .summary-grid .stat .num {
            font-size: 20px;
            font-weight: 700;
        }
        .summary-grid .stat .label {
            font-size: 12px;
            color: #8895aa;
            margin-top: 2px;
        }
        .empty-tip { color: #8895aa; text-align: center; padding: 20px 0; }
        .footer { margin-top: 20px; text-align: center; color: #b0bccd; font-size: 13px; }
        .error-msg { color: #d73a49; font-size: 13px; margin-top: 8px; }
        .quick-fill {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .quick-fill button {
            padding: 4px 12px;
            border: 1px solid #d0d7de;
            border-radius: 12px;
            background: white;
            font-size: 12px;
            cursor: pointer;
            color: #4f8cf7;
        }
        .quick-fill button:hover {
            background: #f0f5ff;
            border-color: #4f8cf7;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            background: #e8f5e9;
            color: #2e7d32;
            margin-left: 8px;
        }
        .auto-load-tip {
            background: #e8f5e9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #2e7d32;
            margin-bottom: 10px;
            display: none;
        }
        .auto-load-tip.show { display: block; }
        @media (max-width: 600px) {
            .fund-row { gap: 4px; }
            .fund-row .field-group { min-width: 50px; }
            .fund-row input { font-size: 13px; padding: 5px 6px; }
            .fund-row .code-input { min-width: 60px; flex: 0.4; }
            .fund-row .shares-input { min-width: 65px; flex: 0.5; }
            .fund-row .cost-input { min-width: 65px; flex: 0.5; }
            .fund-row .nav-input { min-width: 60px; flex: 0.4; }
            .fund-row .prev-input { min-width: 60px; flex: 0.4; }
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .result-detail { grid-template-columns: 1fr 1fr; }
            .btn { padding: 8px 14px; font-size: 14px; }
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #d0d7de;
            border-top-color: #4f8cf7;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="card header">
        <h1>📊 基金收益计算器 <span class="badge">自动加载净值</span></h1>
        <p>输入基金代码、份额和成本，自动从每日报告中加载净值数据</p>
        <div class="tip">
            💡 <strong>使用说明：</strong><br>
            1. 输入基金代码 → 点击「加载净值」自动从每日报告获取最新净值和前日净值<br>
            2. 填写持有份额和持仓成本<br>
            3. 点击「计算收益」查看结果<br>
            <span style="color:#666;font-size:12px;">📌 数据来源：每日自动报告（nav_data.json）· 与自动报告共享数据</span>
        </div>
    </div>

    <!-- 输入区 -->
    <div class="card">
        <div id="autoLoadTip" class="auto-load-tip">✅ 已自动加载净值数据</div>
        <div id="fundList"></div>

        <!-- 快捷填充 -->
        <div class="quick-fill">
            <span style="font-size:13px;color:#8895aa;margin-right:4px;">📌 快速填入：</span>
            <button data-preset="021778">广发纳指F</button>
            <button data-preset="160213">国泰纳指</button>
            <button data-preset="018738">博时标普</button>
        </div>

        <div class="btn-group">
            <button class="btn btn-outline" id="addBtn">＋ 添加基金</button>
            <button class="btn btn-warning" id="loadNavBtn">📥 加载净值</button>
            <button class="btn btn-primary" id="calcBtn">📈 计算收益</button>
            <button class="btn btn-success" id="clearBtn">🗑️ 清空结果</button>
        </div>
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <!-- 结果区 -->
    <div class="card" id="resultArea" style="display:none;">
        <div id="resultSummary"></div>
        <div id="resultDetail"></div>
    </div>

    <div class="footer">数据来源：每日自动报告（nav_data.json）· 点击「加载净值」获取最新数据</div>
</div>

<script>
// ============================================================
// 默认预填三只基金
// ============================================================
const DEFAULT_FUNDS = [
    { code: "021778", shares: 359.16, cost: 3000, nav: 0, prevNav: 0, name: "" },
    { code: "160213", shares: 190.75, cost: 2000, nav: 0, prevNav: 0, name: "" },
    { code: "018738", shares: 269.19, cost: 1500, nav: 0, prevNav: 0, name: "" },
];

let funds = [];
let navDataCache = null;

// ============================================================
// 加载 nav_data.json
// ============================================================
async function loadNavData() {
    try {
        const resp = await fetch('nav_data.json?t=' + Date.now());
        if (!resp.ok) return null;
        const data = await resp.json();
        return data;
    } catch (e) {
        console.warn('加载 nav_data.json 失败:', e);
        return null;
    }
}

// ============================================================
// 从 nav_data.json 填充净值到所有基金
// ============================================================
async function loadNavForAllFunds() {
    const errorDiv = document.getElementById('errorMsg');
    errorDiv.textContent = '';
    
    const navData = await loadNavData();
    if (!navData) {
        errorDiv.textContent = '❌ 无法加载净值数据，请确保每日报告已运行过（nav_data.json 存在）';
        return;
    }
    
    navDataCache = navData;
    let loadedCount = 0;
    let notFoundCount = 0;
    
    funds.forEach((f, idx) => {
        if (f.code && navData[f.code]) {
            f.nav = navData[f.code].latest_nav;
            f.prevNav = navData[f.code].prev_nav;
            f.name = navData[f.code].name || f.code;
            f.fetchStatus = 'success';
            loadedCount++;
        } else if (f.code && f.code.length >= 6) {
            f.fetchStatus = 'error';
            notFoundCount++;
        }
    });
    
    renderInputs();
    
    if (loadedCount > 0 && notFoundCount === 0) {
        errorDiv.textContent = `✅ 已加载 ${loadedCount} 只基金的净值数据`;
        document.getElementById('autoLoadTip').classList.add('show');
        document.getElementById('autoLoadTip').textContent = `✅ 已加载 ${loadedCount} 只基金的净值数据（来自每日报告）`;
    } else if (loadedCount > 0 && notFoundCount > 0) {
        errorDiv.textContent = `⚠️ 已加载 ${loadedCount} 只，${notFoundCount} 只基金代码在数据中未找到`;
    } else {
        errorDiv.textContent = '⚠️ 未找到任何基金的净值数据，请检查基金代码是否正确';
    }
}

// ============================================================
// 渲染输入行
// ============================================================
function renderInputs() {
    const container = document.getElementById('fundList');
    if (funds.length === 0) {
        container.innerHTML = `<div class="empty-tip">还没有基金，点击下方「添加基金」开始</div>`;
        return;
    }
    let html = '';
    funds.forEach((f, idx) => {
        const statusText = f.fetchStatus === 'success' ? '✅ 已加载' : 
                           f.fetchStatus === 'error' ? '❌ 未找到' : '';
        const statusClass = f.fetchStatus === 'success' ? 'success' : 
                           f.fetchStatus === 'error' ? 'error' : '';
        const nameDisplay = f.name ? f.name : '';
        const navDisplay = f.nav > 0 ? f.nav.toFixed(4) : '';
        const prevDisplay = f.prevNav > 0 ? f.prevNav.toFixed(4) : '';
        html += `
            <div class="fund-row" data-index="${idx}">
                <div class="field-group code-input">
                    <label>📌 基金代码 <span class="required">*</span></label>
                    <input type="text" value="${f.code}" placeholder="如 021778" data-field="code">
                    ${nameDisplay ? `<div class="fund-name-tag">${nameDisplay}</div>` : ''}
                </div>
                <div class="field-group shares-input">
                    <label>📦 持有份额 <span class="required">*</span></label>
                    <input type="number" step="0.01" value="${f.shares}" placeholder="如 359.16" data-field="shares">
                </div>
                <div class="field-group cost-input">
                    <label>💳 持仓成本(元) <span class="required">*</span></label>
                    <input type="number" step="0.01" value="${f.cost}" placeholder="如 3000" data-field="cost">
                </div>
                <div class="field-group nav-input">
                    <label>📊 最新净值</label>
                    <input type="number" step="0.0001" value="${navDisplay}" placeholder="加载后自动填充" data-field="nav" readonly style="background:#f5f7fa;color:#1a2332;">
                </div>
                <div class="field-group prev-input">
                    <label>📊 前日净值</label>
                    <input type="number" step="0.0001" value="${prevDisplay}" placeholder="加载后自动填充" data-field="prevNav" readonly style="background:#f5f7fa;color:#1a2332;">
                </div>
                <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:2px;min-width:50px;">
                    <span class="fetch-status ${statusClass}">${statusText}</span>
                </div>
                <button class="remove-btn" data-index="${idx}" title="删除">✕</button>
            </div>
        `;
    });
    container.innerHTML = html;

    // 绑定事件
    container.querySelectorAll('.fund-row').forEach(row => {
        const idx = parseInt(row.dataset.index);
        row.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('input', () => {
                const field = inp.dataset.field;
                if (field === 'code') {
                    funds[idx].code = inp.value.trim().toUpperCase();
                    funds[idx].name = '';
                    funds[idx].fetchStatus = '';
                    // 清空净值
                    funds[idx].nav = 0;
                    funds[idx].prevNav = 0;
                    renderInputs();
                } else if (field === 'shares' || field === 'cost') {
                    const val = parseFloat(inp.value);
                    funds[idx][field] = isNaN(val) ? 0 : val;
                }
            });
        });
        
        const delBtn = row.querySelector('.remove-btn');
        delBtn.addEventListener('click', () => {
            funds.splice(idx, 1);
            renderInputs();
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('errorMsg').textContent = '';
        });
    });
}

// ============================================================
// 快捷填充
// ============================================================
function setupQuickFill() {
    document.querySelectorAll('[data-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
            const code = btn.dataset.preset;
            if (funds.some(f => f.code === code)) {
                document.getElementById('errorMsg').textContent = `⚠️ 基金 ${code} 已存在`;
                return;
            }
            funds.push({ code: code, shares: 0, cost: 0, nav: 0, prevNav: 0, name: '', fetchStatus: '' });
            renderInputs();
            document.getElementById('errorMsg').textContent = `✅ 已添加 ${code}，点击「加载净值」自动填充`;
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('autoLoadTip').classList.remove('show');
        });
    });
}

// ============================================================
// 显示结果
// ============================================================
function showResults(results, summary) {
    const area = document.getElementById('resultArea');
    area.style.display = 'block';

    const summaryHtml = `
        <div class="summary-grid">
            <div class="stat">
                <div class="num ${summary.totalProfit >= 0 ? 'positive' : 'negative'}">${summary.totalProfit >= 0 ? '+' : ''}${summary.totalProfit.toFixed(2)}</div>
                <div class="label">今日总收益 (元)</div>
            </div>
            <div class="stat">
                <div class="num ${summary.totalAccumProfit >= 0 ? 'positive' : 'negative'}">${summary.totalAccumProfit >= 0 ? '+' : ''}${summary.totalAccumProfit.toFixed(2)}</div>
                <div class="label">累计总收益 (元)</div>
            </div>
            <div class="stat">
                <div class="num ${summary.totalAccumRate >= 0 ? 'positive' : 'negative'}">${summary.totalAccumRate >= 0 ? '+' : ''}${summary.totalAccumRate.toFixed(2)}%</div>
                <div class="label">累计总收益率</div>
            </div>
            <div class="stat">
                <div class="num">${summary.totalMarketValue.toFixed(2)}</div>
                <div class="label">账户总市值 (元)</div>
            </div>
            <div class="stat">
                <div class="num">${summary.totalCost.toFixed(2)}</div>
                <div class="label">累计总本金 (元)</div>
            </div>
        </div>
    `;
    document.getElementById('resultSummary').innerHTML = summaryHtml;

    let detailHtml = '';
    results.forEach(r => {
        const profitCls = r.profit >= 0 ? 'positive' : 'negative';
        const accumCls = r.accumProfit >= 0 ? 'positive' : 'negative';
        detailHtml += `
            <div class="result-item">
                <div class="result-header">
                    <span>${r.name ? '【' + r.name + '】' : ''}(${r.code})</span>
                    <span class="${profitCls}">今日 ${r.profit >= 0 ? '+' : ''}${r.profit.toFixed(2)} 元</span>
                </div>
                <div class="result-detail">
                    <span>📅 净值: ${r.nav.toFixed(4)}</span>
                    <span>📊 前日: ${r.prevNav.toFixed(4)}</span>
                    <span>💰 市值: ${r.marketValue.toFixed(2)} 元</span>
                    <span>📈 累计: <span class="${accumCls}">${r.accumProfit >= 0 ? '+' : ''}${r.accumProfit.toFixed(2)} 元</span></span>
                    <span>📈 收益率: <span class="${accumCls}">${r.accumRate >= 0 ? '+' : ''}${r.accumRate.toFixed(2)}%</span></span>
                    <span>💳 本金: ${r.cost.toFixed(2)} 元</span>
                    <span>📦 份额: ${r.shares.toFixed(2)}</span>
                </div>
            </div>
        `;
    });
    document.getElementById('resultDetail').innerHTML = detailHtml;
}

// ============================================================
// 计算主逻辑
// ============================================================
function calculate() {
    const errorDiv = document.getElementById('errorMsg');
    errorDiv.textContent = '';

    const validFunds = funds.filter(f => 
        f.code && f.code.trim().length >= 6 && 
        f.shares > 0 && 
        f.cost > 0 && 
        f.nav > 0 && 
        f.prevNav > 0
    );

    if (validFunds.length === 0) {
        errorDiv.textContent = '⚠️ 请确保每只基金的代码、份额、成本已填，并点击「加载净值」获取最新数据';
        return;
    }

    const results = [];
    let totalProfit = 0, totalAccumProfit = 0, totalMarketValue = 0, totalCost = 0;

    validFunds.forEach(f => {
        const marketValue = f.nav * f.shares;
        const profit = (f.nav - f.prevNav) * f.shares;
        const accumProfit = marketValue - f.cost;
        const accumRate = f.cost > 0 ? (accumProfit / f.cost) * 100 : 0;

        results.push({
            code: f.code,
            name: f.name || f.code,
            shares: f.shares,
            cost: f.cost,
            nav: f.nav,
            prevNav: f.prevNav,
            profit: profit,
            marketValue: marketValue,
            accumProfit: accumProfit,
            accumRate: accumRate
        });

        totalProfit += profit;
        totalAccumProfit += accumProfit;
        totalMarketValue += marketValue;
        totalCost += f.cost;
    });

    const totalAccumRate = totalCost > 0 ? (totalAccumProfit / totalCost) * 100 : 0;
    const summary = {
        totalProfit,
        totalAccumProfit,
        totalAccumRate,
        totalMarketValue,
        totalCost
    };

    showResults(results, summary);
}

// ============================================================
// 清空结果
// ============================================================
function clearResults() {
    document.getElementById('resultArea').style.display = 'none';
    document.getElementById('errorMsg').textContent = '';
}

// ============================================================
// 页面加载时自动加载净值
// ============================================================
async function autoLoadOnStart() {
    // 先检查是否有 nav_data.json
    try {
        const resp = await fetch('nav_data.json?t=' + Date.now());
        if (resp.ok) {
            await loadNavForAllFunds();
        } else {
            document.getElementById('errorMsg').textContent = 'ℹ️ 未找到 nav_data.json，请先运行每日报告或点击「加载净值」重试';
        }
    } catch (e) {
        console.warn('自动加载失败:', e);
    }
}

// ============================================================
// 初始化
// ============================================================
function init() {
    funds = DEFAULT_FUNDS.map(f => ({ ...f, name: '', fetchStatus: '' }));
    renderInputs();
    setupQuickFill();

    document.getElementById('addBtn').addEventListener('click', () => {
        funds.push({ code: '', shares: 0, cost: 0, nav: 0, prevNav: 0, name: '', fetchStatus: '' });
        renderInputs();
        clearResults();
        document.getElementById('autoLoadTip').classList.remove('show');
    });

    document.getElementById('loadNavBtn').addEventListener('click', loadNavForAllFunds);
    document.getElementById('calcBtn').addEventListener('click', calculate);
    document.getElementById('clearBtn').addEventListener('click', clearResults);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.closest('#fundList')) {
            calculate();
        }
    });

    // 页面加载后自动加载净值
    setTimeout(autoLoadOnStart, 500);
}

init();
</script>
</body>
</html>
